<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레퍼런스 보드</title>
<style>
  :root{
    --bg:#faf9f7;
    --card-bg:#ffffff;
    --text:#1f1d1a;
    --sub:#8a8478;
    --line:#e8e4dd;
    --accent:#c98a4b;
    --accent-bg:#fdf2e5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:32px 20px 16px;
    max-width:1100px;
    margin:0 auto;
  }
  header h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.3px;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:13px;
  }
  .tabs{
    max-width:1100px;
    margin:0 auto;
    padding:0 20px 20px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .tab{
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--text);
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:0 20px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.06);
  }
  .card .thumb{
    width:100%;
    aspect-ratio:3/4;
    background:var(--accent-bg) center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
    font-size:13px;
  }
  .card .body{
    padding:12px 14px 14px;
  }
  .card .cat{
    display:inline-block;
    font-size:11px;
    color:var(--accent);
    background:var(--accent-bg);
    padding:2px 8px;
    border-radius:6px;
    margin-bottom:6px;
  }
  .card .title{
    font-size:14px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.35;
  }
  .card .memo{
    font-size:12px;
    color:var(--sub);
    margin:0;
    line-height:1.4;
  }
  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--sub);
  }
  .empty h2{
    font-size:16px;
    color:var(--text);
    margin:0 0 8px;
  }
  .empty p{
    font-size:13px;
    margin:0;
  }
  footer{
    text-align:center;
    padding:24px;
    color:var(--sub);
    font-size:11px;
  }
</style>
</head>
<body>

<header>
  <h1>레퍼런스 보드</h1>
  <p id="count-label">참고 상품 링크 모음</p>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">
    <h2>아직 추가된 항목이 없어요</h2>
    <p>클로드에게 "이 상품 링크 OO 카테고리에 추가해줘" 라고 말하면 여기에 카드가 생겨요.</p>
  </div>
</main>

<footer>레퍼런스 보드 · GitHub Pages</footer>

<script>
/* ============================================================
   여기에 데이터를 추가/수정합니다.
   category: 카테고리 이름 (탭으로 표시됨)
   title: 상품/레퍼런스 이름
   url: 링크 (클릭 시 새 탭으로 이동)
   image: 썸네일 이미지 URL (없으면 빈 문자열 "")
   memo: 짧은 메모 (선택, 없으면 빈 문자열 "")
   ============================================================ */
const boardData = [
  { category: "티셔츠", title: "[오제 PICK] 에센셜 라운드넥 반팔 티셔츠 MDTS073_10 Colors", url: "https://www.29cm.co.kr/products/3185392", image: "https://img.29cm.co.kr/item/202603/11f128cfe3e36d419454f55a8a0462c2.jpg", memo: "" },
  { category: "탑", title: "WOOL TENCEL LONG SLEEVE T-SHIRT_BEIGE [LW263TS02BE]", url: "https://www.29cm.co.kr/products/4125659", image: "https://img.29cm.co.kr/item/202608/11f195704c08161a8fdcbd097013d57c.jpg", memo: "" },
  { category: "긴팔셔츠", title: "[리엘][5th] Bail overfit shirt (red check)", url: "https://www.wconcept.co.kr/Product/308303345", image: "https://product-image.wconcept.co.kr/productimg/image/img2/45/308303345_AE21915.jpg", memo: "" },
  { category: "반팔셔츠", title: "[무니드]PEARL HALF SHIRT - CREAM", url: "https://www.wconcept.co.kr/Product/308574545", image: "https://product-image.wconcept.co.kr/productimg/image/img2/45/308574545_DH89023.jpg", memo: "" },
  { category: "스커트", title: "[무니드]MELT MAXI SKIRT - CHARCOAL", url: "https://www.wconcept.co.kr/Product/308283747", image: "https://product-image.wconcept.co.kr/productimg/image/img2/47/308283747_UO30713.jpg", memo: "" },
];
/* ============================================================ */

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const countLabel = document.getElementById('count-label');

const categories = ['전체', ...Array.from(new Set(boardData.map(d => d.category)))];
let activeCat = '전체';

function render(){
  tabsEl.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat === activeCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => { activeCat = cat; render(); };
    tabsEl.appendChild(btn);
  });

  const items = activeCat === '전체' ? boardData : boardData.filter(d => d.category === activeCat);
  countLabel.textContent = `총 ${boardData.length}개 · ${activeCat} ${items.length}개`;

  gridEl.innerHTML = '';
  if(items.length === 0){
    emptyEl.style.display = 'block';
    gridEl.style.display = 'none';
    return;
  }
  emptyEl.style.display = 'none';
  gridEl.style.display = 'grid';

  items.forEach(item => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if(item.image){
      thumb.style.backgroundImage = `url('${item.image}')`;
    } else {
      thumb.textContent = '이미지 없음';
    }

    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `
      <span class="cat">${item.category}</span>
      <p class="title">${item.title}</p>
      ${item.memo ? `<p class="memo">${item.memo}</p>` : ''}
    `;

    a.appendChild(thumb);
    a.appendChild(body);
    gridEl.appendChild(a);
  });
}

render();
</script>

</body>
</html>
