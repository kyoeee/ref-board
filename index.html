<style>

  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  .wrap{max-width:1280px;margin:0 auto;padding:0 22px 80px}
  header.top{position:sticky;top:0;z-index:20;background:rgba(250,243,236,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--chip)}
  .hd{max-width:1280px;margin:0 auto;padding:18px 22px 14px}
  .htitle{font-family:'Jua',cursive;font-size:26px;font-weight:400;letter-spacing:-.01em;color:var(--ink)}
  .hsub{font-family:'Gaegu',cursive;font-size:14px;font-weight:700;color:var(--accent);margin-top:4px}
  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .pill{font-family:'Noto Sans KR',sans-serif;font-size:12.5px;font-weight:700;padding:8px 15px;border:1.5px solid var(--chip);border-radius:999px;background:var(--pill);color:var(--ink);cursor:pointer;transition:.13s;white-space:nowrap}
  .pill:hover{border-color:var(--accent)}
  .pill.on{background:var(--pillon);color:#fff;border-color:var(--pillon)}
  section.cat{padding-top:30px}
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .chead h2, .mbhead h2{font-family:'Jua',cursive;font-size:20px;font-weight:400;margin:0;color:var(--ink);letter-spacing:-.01em}
  .cnt{font-size:11.5px;font-weight:700;color:var(--ink);background:var(--chip);padding:3px 10px;border-radius:999px}
  .cnote{font-size:12px;color:var(--sub);margin:0 0 15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:16px 15px}
  .card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:.14s;cursor:pointer}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(28,58,94,.14);border-color:var(--accent)}
  .thumb{position:relative;width:100%;aspect-ratio:3/4;background:#f2e9e2;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;left:9px;top:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;letter-spacing:.02em}
  .heart{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);color:var(--heart);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
  .info{padding:12px 13px 14px}
  .brand{font-size:11px;font-weight:800;color:var(--ink);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px;opacity:.65}
  .name{font-size:12.5px;line-height:1.35;font-weight:500;color:var(--ink);height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .prow{display:flex;align-items:baseline;gap:6px;margin-top:8px;flex-wrap:wrap}
  .final{font-size:14.5px;font-weight:800;color:var(--ink)}
  .dc{font-size:12px;font-weight:800;color:var(--accent)}
  .orig{font-size:11px;color:#b9aca3;text-decoration:line-through}
  .meta{font-size:11px;color:var(--sub);margin-top:6px}
  .empty{text-align:center;padding:80px 20px;color:var(--sub)}
  .empty h2{font-family:'Jua',cursive;font-weight:400;font-size:19px;color:var(--ink);margin:0 0 8px}
  .empty p{font-size:13px;margin:0}
  .foot{text-align:center;color:var(--ink);font-size:11.5px;margin-top:56px;line-height:1.7;background:var(--chip);padding:16px;border-radius:16px}
  .moodboard{padding-bottom:8px;margin-bottom:6px;border-bottom:2px dashed var(--chip)}

  .mbupload:hover{background:var(--accent)}

  .mbrow{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 16px;scrollbar-width:none}
  .mbrow::-webkit-scrollbar{display:none}
  .mbcard{position:relative;flex:0 0 auto;width:190px;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#f2e9e2;border:1.5px solid var(--line)}
  .mbcard img{width:100%;height:100%;object-fit:cover;display:block}
  .mbdel{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:rgba(28,58,94,.72);color:#fff;border:none;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .mbempty{flex:0 0 auto;width:190px;aspect-ratio:3/4;border-radius:18px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;text-align:center;padding:14px}

const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

const categories = ['전체', ...Array.from(new Set(boardData.map(d => d.category)))];
let activeCat = '전체';

function won(n){
  return '₩' + Number(n || 0).toLocaleString();
}

function buildCard(item){
  const a = document.createElement('a');
  a.className = 'card';
  a.href = item.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if(item.discount){
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = item.discount + '%';
    thumb.appendChild(badge);
  }
  if(item.likes){
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = '♥ ' + item.likes;
    thumb.appendChild(heart);
  }
  if(item.image){
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = item.image;
    img.alt = item.title;
    thumb.appendChild(img);
  }

  const info = document.createElement('div');
  info.className = 'info';

  const metaText = item.likes ? ('관심 ♥ ' + item.likes) : (item.reviews ? ('리뷰 ' + item.reviews + '개') : '');

  info.innerHTML = `
    <div class="brand">${item.brand || ''}</div>
    <div class="name">${item.title}</div>
    <div class="prow">
      <span class="final">${won(item.price)}</span>
      ${item.discount ? `<span class="dc">${item.discount}%</span>` : ''}
      ${item.originalPrice ? `<span class="orig">${won(item.originalPrice)}</span>` : ''}
    </div>
    ${metaText ? `<div class="meta">${metaText}</div>` : ''}
  `;

  a.appendChild(thumb);
  a.appendChild(info);
  return a;
}

/* ===================== 무드보드 (이미지 업로드형 캐러셀) =====================
   전체 탭 상단에만 노출됩니다. 사이트가 정적 호스팅이라 서버 저장은 불가하므로,
   업로드한 이미지는 이 브라우저(이 컴퓨터)의 localStorage에만 저장됩니다.
   즉 회의 중 그 자리에서 바로 이미지를 올려 훑어보는 용도이며,
   다른 기기/브라우저에는 자동으로 동기화되지 않습니다. */
const MB_KEY = 'refboard_moodboard_v1';

function loadMoodboard(){
  try{ return JSON.parse(localStorage.getItem(MB_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveMoodboard(list){
  try{ localStorage.setItem(MB_KEY, JSON.stringify(list)); }
  catch(e){ alert('이미지 저장 공간이 가득 찼어요. 몇 개 삭제한 뒤 다시 시도해주세요.'); }
}
let moodboardImages = loadMoodboard();

function resizeImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1400;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function addMoodboardFiles(fileList){
  const files = Array.from(fileList || []).filter(f => f.type && f.type.startsWith('image/'));
  if(files.length === 0) return;
  Promise.all(files.map(resizeImageFile)).then(dataUrls => {
    dataUrls.forEach(src => {
      moodboardImages.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 8), src });
    });
    saveMoodboard(moodboardImages);
    renderMoodboardRow();
  }).catch(() => alert('이미지를 불러오는 중 문제가 발생했어요.'));
}

function removeMoodboardImage(id){
  moodboardImages = moodboardImages.filter(m => m.id !== id);
  saveMoodboard(moodboardImages);
  renderMoodboardRow();
}

function updateMoodboardArrows(){
  const row = document.getElementById('mbRow');
  const left = document.getElementById('mbLeft');
  const right = document.getElementById('mbRight');
  if(!row || !left || !right) return;
  left.hidden = row.scrollLeft <= 4;
  right.hidden = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
}

function renderMoodboardRow(){
  const row = document.getElementById('mbRow');
  const cnt = document.getElementById('mbCnt');
  if(!row) return;
  if(cnt) cnt.textContent = moodboardImages.length;
  row.innerHTML = '';
  if(moodboardImages.length === 0){
    const empty = document.createElement('div');
    empty.className = 'mbempty';
    empty.textContent = '+ 버튼으로 이미지를 올려보세요';
    row.appendChild(empty);
  } else {
    moodboardImages.forEach(m => {
      const card = document.createElement('div');
      card.className = 'mbcard';
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = m.src;
      card.appendChild(img);
      const del = document.createElement('button');
      del.className = 'mbdel';
      del.textContent = '×';
      del.title = '삭제';
      del.onclick = (e) => { e.stopPropagation(); removeMoodboardImage(m.id); };
      card.appendChild(del);
      row.appendChild(card);
    });
  }
  updateMoodboardArrows();
}

function buildMoodboard(){
  const section = document.createElement('section');
  section.className = 'moodboard';

  const head = document.createElement('div');
  head.className = 'mbhead';

  const titleWrap = document.createElement('div');
  titleWrap.className = 'mbtitle';
  titleWrap.innerHTML = `<h2>무드보드</h2><span class="cnt" id="mbCnt">${moodboardImages.length}</span>`;
  head.appendChild(titleWrap);

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'image/*';
  fileInput.multiple = true;
  fileInput.hidden = true;
  fileInput.onchange = (e) => { addMoodboardFiles(e.target.files); fileInput.value = ''; };

  const uploadBtn = document.createElement('button');
  uploadBtn.className = 'mbupload';
  uploadBtn.type = 'button';
  uploadBtn.textContent = '+ 이미지 업로드';
  uploadBtn.onclick = () => fileInput.click();

  head.appendChild(uploadBtn);
  head.appendChild(fileInput);
  section.appendChild(head);

  const mbwrap = document.createElement('div');
  mbwrap.className = 'mbwrap';

  const row = document.createElement('div');
  row.className = 'mbrow';
  row.id = 'mbRow';
  row.onscroll = updateMoodboardArrows;

  const leftBtn = document.createElement('button');
  leftBtn.className = 'mbarrow left';
  leftBtn.id = 'mbLeft';
  leftBtn.type = 'button';
  leftBtn.innerHTML = '&#8249;';
  leftBtn.hidden = true;
  leftBtn.onclick = () => row.scrollBy({ left: -420, behavior: 'smooth' });

  const rightBtn = document.createElement('button');
  rightBtn.className = 'mbarrow';
  rightBtn.id = 'mbRight';
  rightBtn.type = 'button';
  rightBtn.innerHTML = '&#8250;';
  rightBtn.onclick = () => row.scrollBy({ left: 420, behavior: 'smooth' });

  mbwrap.appendChild(row);
  mbwrap.appendChild(leftBtn);
  mbwrap.appendChild(rightBtn);
  section.appendChild(mbwrap);

  setTimeout(renderMoodboardRow, 0);
  return section;
}
/* ============================================================ */

function buildSection(cat, items, showHeading){
  const section = document.createElement('section');
  section.className = 'cat';
  if(showHeading){
    const chead = document.createElement('div');
    chead.className = 'chead';
    chead.innerHTML = `<h2>${cat}</h2><span class="cnt">${items.length}</span>`;
    section.appendChild(chead);
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  items.forEach(item => grid.appendChild(buildCard(item)));
  section.appendChild(grid);
  return section;
}

function render(){
  tabsEl.innerHTML = '';
  categories.forEach(cat => {
    const cnt = cat === '전체' ? boardData.length : boardData.filter(d => d.category === cat).length;
    const btn = document.createElement('button');
    btn.className = 'pill' + (cat === activeCat ? ' on' : '');
    btn.textContent = cat + ' ' + cnt;
    btn.onclick = () => { activeCat = cat; render(); };
    tabsEl.appendChild(btn);
  });

  contentEl.innerHTML = '';

  if(activeCat === '전체'){
    contentEl.appendChild(buildMoodboard());
  }

  if(boardData.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `
      <h2>아직 추가된 항목이 없어요</h2>
      <p>클로드에게 "이 상품 링크 OO 카테고리에 추가해줘" 라고 말하면 여기에 카드가 생겨요.</p>
    `;
    contentEl.appendChild(empty);
    return;
  }

  if(activeCat === '전체'){
    const cats = Array.from(new Set(boardData.map(d => d.category)));
    cats.forEach(cat => {
      const items = boardData.filter(d => d.category === cat);
      contentEl.appendChild(buildSection(cat, items, true));
    });
  } else {
    const items = boardData.filter(d => d.category === activeCat);
    contentEl.appendChild(buildSection(activeCat, items, false));
  }
}

render();
</script>
